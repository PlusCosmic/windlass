# Default policy for fixtures: the gate-only lanes, and one lane that ends in an evaluator.
policy: v1
defaults:
  always:
    - gate: no_new_skips
    - gate: ci_green
  on_evaluator_error: escalate

categories:
  docs_only:
    gates:
      - paths_only: ["**/*.md", "docs/**"]
    outcome: merge

  test_only:
    gates:
      - paths_only: ["**/test/**", "**/tests/**", "**/*.test.ts", "**/*_test.go"]
    outcome: merge

  flagged_feature:
    gates:
      - flag_referenced
      - paths_none: ["migrations/**"]
    evaluators:
      - id: fully_flag_gated
        min_confidence: 0.85
    outcome: merge

fallback: escalate
