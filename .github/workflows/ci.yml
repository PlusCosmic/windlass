name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      # The Action runs from the committed bundle, so it must match the source.
      - run: git diff --exit-code -- action/dist

  # The App's image only builds here and in the publish workflow; catch a broken Dockerfile before it merges.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: windlass:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The runner depends on a native CLI installed in the image. With no credential it can only
      # report that it is signed out, which still shows the CLI starts on this image's platform.
      - name: The runner's CLI starts in the image
        run: docker run --rm windlass:ci node server.mjs runner --check
