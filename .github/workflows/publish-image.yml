name: Publish Image

# Builds the App's image on every push to master that changes it, and opens a PR against PlusCosmic/infrastructure
# that bumps services/windlass.yml to it. Merging that PR is what deploys (Dokploy auto-deploy).

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "github/**"
      - "app/**"
      - "web/**"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One run at a time, in push order, so an older run can never close a newer run's bump PR.
concurrency:
  group: publish-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/pluscosmic/windlass
  COMPOSE_FILE: services/windlass.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-infrastructure:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check for token
        id: token
        env:
          TOKEN: ${{ secrets.INFRASTRUCTURE_PR_TOKEN }}
        run: |
          if [[ -z "$TOKEN" ]]; then
            echo "::warning::INFRASTRUCTURE_PR_TOKEN is not set; image pushed but no bump PR opened."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout infrastructure repo
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: PlusCosmic/infrastructure
          token: ${{ secrets.INFRASTRUCTURE_PR_TOKEN }}
          path: infrastructure

      - name: Bump compose image tag
        id: bump
        if: steps.token.outputs.present == 'true'
        working-directory: infrastructure
        run: |
          if [[ ! -f "$COMPOSE_FILE" ]]; then
            echo "::warning::$COMPOSE_FILE is not on infrastructure main yet; skipping the bump PR."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i -E "s#(image:[[:space:]]*['\"]?)${IMAGE//./\\.}:[^'\"[:space:]]+#\1${IMAGE}:sha-${GITHUB_SHA}#" "$COMPOSE_FILE"
          grep -q "${IMAGE}:sha-${GITHUB_SHA}" "$COMPOSE_FILE" || { echo "::error::No $IMAGE image line in $COMPOSE_FILE"; exit 1; }
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Close previous bump PRs
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.INFRASTRUCTURE_PR_TOKEN }}
        run: |
          gh pr list --repo PlusCosmic/infrastructure --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("automation/windlass-")) | .number' \
          | while read -r pr; do
              [[ -n "$pr" ]] || continue
              gh pr close "$pr" --repo PlusCosmic/infrastructure --delete-branch \
                --comment "Superseded by a newer windlass image bump."
            done

      - name: Create infrastructure PR
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          path: infrastructure
          token: ${{ secrets.INFRASTRUCTURE_PR_TOKEN }}
          branch: automation/windlass-${{ github.sha }}
          delete-branch: true
          commit-message: Bump windlass to sha-${{ github.sha }}
          title: Bump windlass to sha-${{ github.sha }}
          body: |
            Updates `${{ env.COMPOSE_FILE }}` to `${{ env.IMAGE }}:sha-${{ github.sha }}`.

            Built from `${{ github.repository }}` commit `${{ github.sha }}`.
